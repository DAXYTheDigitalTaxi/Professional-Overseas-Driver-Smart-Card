<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Radial Gold Sheen -->
    <radialGradient id="sealGold" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FFF4D4"/>
      <stop offset="60%" stop-color="#ECC66F"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </radialGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7722"/>
      <stop offset="100%" stop-color="#D9480F"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142B4E"/>
      <stop offset="100%" stop-color="#091A33"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring with Subtle Border -->
  <circle cx="100" cy="100" r="96" fill="url(#navyGrad)" stroke="#ECC66F" stroke-width="3.5" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ECC66F" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.8" />
  
  <!-- Inner Background -->
  <circle cx="100" cy="100" r="82" fill="#0E2342" stroke="#ECC66F" stroke-width="1.5" />

  <!-- Center Decorative Shield / Samai Diya Sacred Lamp Symbol of Maharashtra -->
  <g transform="translate(100, 100)">
    <!-- Aura Rays -->
    <circle cx="0" cy="-6" r="32" fill="#ECC66F" opacity="0.12" />

    <!-- Traditional Samai / Deepak (Traditional Brass Lamp of Maharashtra State Seal) -->
    <!-- Base -->
    <path d="M-22 34 L22 34 Q18 28 8 26 L8 22 L-8 22 L-8 26 Q-18 28 -22 34 Z" fill="url(#sealGold)" stroke="#996515" stroke-width="0.8"/>
    <!-- Stem Column -->
    <path d="M-6 22 L6 22 Q4 8 8 -2 L-8 -2 Q-4 8 -6 22 Z" fill="url(#sealGold)" stroke="#996515" stroke-width="0.8"/>
    <!-- Lamp Oil Cup Ring -->
    <path d="M-24 -2 Q0 -6 24 -2 Q20 8 0 8 Q-20 8 -24 -2 Z" fill="url(#sealGold)" stroke="#996515" stroke-width="0.8"/>
    <!-- Center Flame (Jyoti) -->
    <path d="M0 -34 Q8 -18 6 -6 Q0 0 -6 -6 Q-8 -18 0 -34 Z" fill="url(#saffronGrad)" stroke="#ECC66F" stroke-width="1"/>
    <path d="M0 -28 Q4 -16 3 -8 Q0 -4 -3 -8 Q-4 -16 0 -28 Z" fill="#FFF275"/>
    
    <!-- Decorative side flames / samai petals -->
    <path d="M-18 -2 Q-14 -12 -12 -2 Z" fill="url(#saffronGrad)" />
    <path d="M18 -2 Q14 -12 12 -2 Z" fill="url(#saffronGrad)" />
  </g>

  <!-- Laurel / Grain Wreath Foliage on both sides -->
  <g fill="none" stroke="#ECC66F" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <!-- Left Branch -->
    <path d="M38 126 C28 98 28 68 44 42" />
    <circle cx="34" cy="112" r="2.2" fill="#ECC66F" stroke="none" />
    <circle cx="28" cy="94" r="2.2" fill="#ECC66F" stroke="none" />
    <circle cx="28" cy="74" r="2.2" fill="#ECC66F" stroke="none" />
    <circle cx="36" cy="54" r="2.2" fill="#ECC66F" stroke="none" />
    
    <!-- Right Branch -->
    <path d="M162 126 C172 98 172 68 156 42" />
    <circle cx="166" cy="112" r="2.2" fill="#ECC66F" stroke="none" />
    <circle cx="172" cy="94" r="2.2" fill="#ECC66F" stroke="none" />
    <circle cx="172" cy="74" r="2.2" fill="#ECC66F" stroke="none" />
    <circle cx="164" cy="54" r="2.2" fill="#ECC66F" stroke="none" />
  </g>

  <!-- Curving Devanagari Banner: महाराष्ट्र शासन -->
  <!-- Top Arc for text -->
  <path id="topTextArc" d="M 32 88 A 70 70 0 0 1 168 88" fill="none" />
  <path id="bottomTextArc" d="M 166 122 A 70 70 0 0 1 34 122" fill="none" />

  <text font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-weight="700" font-size="14" fill="#ECC66F" letter-spacing="2">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      महाराष्ट्र शासन
    </textPath>
  </text>

  <!-- Bottom Motto Arc: सत्यमेव जयते / सत्यमेव जयते -->
  <text font-family="'Mukta', 'Noto Sans Devanagari', 'Inter', sans-serif" font-weight="600" font-size="9" fill="#FFF2B2" letter-spacing="1.5">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      सत्यमेव जयते • GOVT. OF MAHARASHTRA
    </textPath>
  </text>

  <!-- Five-point stars on sides -->
  <g fill="#ECC66F">
    <polygon points="26,100 28,104 33,104 29,107 31,111 26,108 22,111 24,107 20,104 25,104" transform="scale(0.8) translate(8, 24)" />
    <polygon points="174,100 176,104 181,104 177,107 179,111 174,108 170,111 172,107 168,104 173,104" transform="scale(0.8) translate(38, 24)" />
  </g>
</svg>
